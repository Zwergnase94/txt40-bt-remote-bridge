<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="blueBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0055aa"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>
    <linearGradient id="espBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="txtBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="920" height="300" rx="14" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- Title -->
  <text x="460" y="34" fill="#f0f6fc" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    Systemarchitektur: fischertechnik BT Control Set am TXT 4.0 (ohne Root-Zugriff)
  </text>

  <!-- Box 1: Blue BT Remote -->
  <g transform="translate(30, 60)">
    <rect width="230" height="195" rx="12" fill="url(#blueBox)" stroke="#388bfd" stroke-width="2"/>
    <text x="115" y="28" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
      fischertechnik BT Sender
    </text>
    <text x="115" y="47" fill="#a5d6ff" font-family="sans-serif" font-size="11" text-anchor="middle">
      Art.-Nr. 540585 / Modell 161942
    </text>
    <!-- Joysticks illustration -->
    <circle cx="68" cy="105" r="32" fill="#002244" stroke="#58a6ff" stroke-width="1.5"/>
    <line x1="68" y1="77" x2="68" y2="133" stroke="#1f6feb" stroke-width="1"/>
    <line x1="40" y1="105" x2="96" y2="105" stroke="#1f6feb" stroke-width="1"/>
    <circle cx="80" cy="90" r="10" fill="#ff4466" stroke="#ffffff" stroke-width="1.5"/>

    <circle cx="162" cy="105" r="32" fill="#002244" stroke="#58a6ff" stroke-width="1.5"/>
    <line x1="162" y1="77" x2="162" y2="133" stroke="#1f6feb" stroke-width="1"/>
    <line x1="134" y1="105" x2="190" y2="105" stroke="#1f6feb" stroke-width="1"/>
    <circle cx="162" cy="105" r="10" fill="#58a6ff" stroke="#ffffff" stroke-width="1.5"/>

    <!-- LED & Buttons -->
    <circle cx="115" cy="78" r="5" fill="#00e5ff"/>
    <rect x="92" y="152" width="46" height="18" rx="4" fill="#0d419d" stroke="#79c0ff" stroke-width="1"/>
    <text x="115" y="165" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">SELECT</text>
    <text x="115" y="185" fill="#cae8ff" font-family="monospace" font-size="10" text-anchor="middle">MAC: 10:45:F8:xx:xx:xx</text>
  </g>

  <!-- Arrow 1: BLE Connection -->
  <g transform="translate(265, 115)">
    <line x1="5" y1="35" x2="115" y2="35" stroke="#00e5ff" stroke-width="3" stroke-dasharray="6,4"/>
    <polygon points="115,29 127,35 115,41" fill="#00e5ff"/>
    <text x="65" y="14" fill="#00e5ff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Bluetooth LE</text>
    <text x="65" y="28" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">"BT Control Receiver"</text>
    <text x="65" y="53" fill="#79c0ff" font-family="monospace" font-size="10" text-anchor="middle">Handles 0x0024..0x002A</text>
    <text x="65" y="67" fill="#79c0ff" font-family="monospace" font-size="10" text-anchor="middle">Kanal: Handle 0x001D</text>
  </g>

  <!-- Box 2: ESP32 Bridge -->
  <g transform="translate(398, 60)">
    <rect width="190" height="195" rx="12" fill="url(#espBox)" stroke="#3fb950" stroke-width="2"/>
    <text x="95" y="28" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
      ESP32 Bridge
    </text>
    <text x="95" y="46" fill="#56d364" font-family="monospace" font-size="11" text-anchor="middle">
      NimBLE + Wire Slave
    </text>

    <rect x="18" y="60" width="154" height="82" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="95" y="79" fill="#e6edf3" font-family="monospace" font-size="10" text-anchor="middle">BLE MAC: 10:45:F8:11:22:32</text>
    <text x="95" y="96" fill="#7ee787" font-family="monospace" font-size="10" text-anchor="middle">I²C-Slave: 0x42 (100kHz)</text>
    <text x="95" y="113" fill="#ffa657" font-family="monospace" font-size="10" text-anchor="middle">6-Byte Paket (40 Hz):</text>
    <text x="95" y="129" fill="#8b949e" font-family="monospace" font-size="9.5" text-anchor="middle">[conn, ch, LY, LX, RY, RX]</text>

    <text x="95" y="164" fill="#d2a8ff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      Failsafe integriert:
    </text>
    <text x="95" y="180" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">
      Sender aus → alle Achsen = 0
    </text>
  </g>

  <!-- Arrow 2: I2C + 5V Connection -->
  <g transform="translate(593, 115)">
    <line x1="5" y1="25" x2="90" y2="25" stroke="#3fb950" stroke-width="3"/>
    <polygon points="90,19 102,25 90,31" fill="#3fb950"/>
    <line x1="5" y1="45" x2="90" y2="45" stroke="#ff7b72" stroke-width="2.5"/>
    <text x="52" y="14" fill="#56d364" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">I²C Bus 3 (EXT1)</text>
    <text x="52" y="62" fill="#ffa198" font-family="monospace" font-size="10" text-anchor="middle">+5V über S1 Pin 2</text>
    <text x="52" y="76" fill="#8b949e" font-family="monospace" font-size="9.5" text-anchor="middle">(USB1 bleibt frei!)</text>
  </g>

  <!-- Box 3: TXT 4.0 Controller -->
  <g transform="translate(700, 60)">
    <rect width="190" height="195" rx="12" fill="url(#txtBox)" stroke="#f85149" stroke-width="2"/>
    <text x="95" y="28" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
      TXT 4.0 Controller
    </text>
    <text x="95" y="46" fill="#ff7b72" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      Kein Root erforderlich!
    </text>

    <!-- Screen mockup inside TXT 4.0 -->
    <rect x="22" y="58" width="146" height="90" rx="6" fill="#070b10" stroke="#1c2b3d" stroke-width="1.5"/>
    <text x="95" y="75" fill="#00e5ff" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">
      ROBO Pro Coding / Python
    </text>
    <circle cx="95" cy="108" r="24" fill="none" stroke="#1b2a3d" stroke-width="1.5"/>
    <line x1="95" y1="108" x2="111" y2="92" stroke="#ffcc00" stroke-width="2.5"/>
    <circle cx="111" cy="92" r="4" fill="#ff3366"/>
    <text x="95" y="142" fill="#7ee787" font-family="monospace" font-size="9" text-anchor="middle">smbus2.SMBus(3) @ 0x42</text>

    <text x="95" y="168" fill="#e6edf3" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      Steuert M1–M4 &amp; S1–S3
    </text>
    <text x="95" y="183" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">
      inkl. Omniwheel 1-Stick App
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="100%" height="100%">
  <rect width="880" height="420" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <text x="440" y="34" fill="#f0f6fc" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    Verkabelungsplan: TXT 4.0 (EXT1 + S1) ↔ ESP32 (4 Jumper-Kabel, USB1 bleibt frei)
  </text>

  <!-- Left: TXT 4.0 Ports -->
  <g transform="translate(40, 60)">
    <rect width="310" height="330" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="155" y="28" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
      fischertechnik TXT 4.0 (Oben links)
    </text>

    <!-- Servo Header S1..S3 -->
    <text x="155" y="56" fill="#8b949e" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      Servo-Anschlüsse S1 – S3 (2,54 mm Stifte)
    </text>
    <rect x="55" y="66" width="200" height="62" rx="6" fill="#090d13" stroke="#30363d" stroke-width="1.5"/>

    <!-- S1 Pins -->
    <text x="38" y="90" fill="#f0f6fc" font-family="monospace" font-size="12" font-weight="bold">S1</text>
    <!-- Pin 1 GND -->
    <rect x="82" y="77" width="16" height="16" rx="2" fill="#6e7681" stroke="#f0f6fc" stroke-width="1"/>
    <text x="90" y="112" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">Pin 1 (GND)</text>
    <!-- Pin 2 +5V -->
    <rect x="147" y="77" width="16" height="16" rx="2" fill="#ff4444" stroke="#ffffff" stroke-width="1.5"/>
    <text x="155" y="112" fill="#ff7b72" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Pin 2 (+5V/2A)</text>
    <!-- Pin 3 Signal -->
    <rect x="212" y="77" width="16" height="16" rx="2" fill="#30363d"/>
    <text x="220" y="112" fill="#6e7681" font-family="monospace" font-size="10" text-anchor="middle">Pin 3 (Sig)</text>

    <!-- EXT1 Socket -->
    <text x="155" y="158" fill="#8b949e" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      Buchse EXT1 oder EXT2 (Kerbe/Nase links)
    </text>

    <!-- Shrouded 6-pin connector with left notch -->
    <path d="M 85 170 L 225 170 L 225 305 L 85 305 L 85 252 L 97 252 L 97 222 L 85 222 Z"
          fill="#090d13" stroke="#58a6ff" stroke-width="2"/>
    <text x="55" y="241" fill="#58a6ff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">[Kerbe]</text>

    <!-- Row 1: Pin 1 & Pin 2 -->
    <rect x="115" y="185" width="18" height="18" rx="3" fill="#30363d"/>
    <text x="124" y="216" fill="#6e7681" font-family="monospace" font-size="10" text-anchor="middle">(1) +3,3V</text>

    <rect x="177" y="185" width="18" height="18" rx="3" fill="#8b949e" stroke="#ffffff" stroke-width="1.5"/>
    <text x="186" y="216" fill="#f0f6fc" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">(2) GND</text>

    <!-- Row 2: Pin 3 & Pin 4 -->
    <rect x="115" y="230" width="18" height="18" rx="3" fill="#30363d"/>
    <text x="124" y="260" fill="#6e7681" font-family="monospace" font-size="10" text-anchor="middle">(3) CANL</text>

    <rect x="177" y="230" width="18" height="18" rx="3" fill="#30363d"/>
    <text x="186" y="260" fill="#6e7681" font-family="monospace" font-size="10" text-anchor="middle">(4) CANH</text>

    <!-- Row 3: Pin 5 & Pin 6 -->
    <rect x="115" y="272" width="18" height="18" rx="3" fill="#d29922" stroke="#ffffff" stroke-width="1.5"/>
    <text x="124" y="301" fill="#e3b341" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">(5) SCL</text>

    <rect x="177" y="272" width="18" height="18" rx="3" fill="#2ea043" stroke="#ffffff" stroke-width="1.5"/>
    <text x="186" y="301" fill="#56d364" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">(6) SDA</text>
  </g>

  <!-- Right: ESP32 Board -->
  <g transform="translate(550, 60)">
    <rect width="290" height="330" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="145" y="28" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
      ESP32 DevKit / NodeMCU Board
    </text>

    <!-- PCB representation -->
    <rect x="45" y="50" width="200" height="255" rx="8" fill="#0f291e" stroke="#2ea043" stroke-width="2"/>
    <rect x="75" y="65" width="140" height="90" rx="4" fill="#8b949e" stroke="#f0f6fc" stroke-width="1"/>
    <text x="145" y="112" fill="#0d1117" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">ESP32-WROOM-32</text>

    <!-- Pins on ESP32 -->
    <!-- VIN (5V) -->
    <rect x="53" y="80" width="16" height="16" rx="2" fill="#ff4444" stroke="#ffffff" stroke-width="1.5"/>
    <text x="76" y="92" fill="#ff7b72" font-family="monospace" font-size="12" font-weight="bold">VIN (5V)</text>

    <!-- GND -->
    <rect x="53" y="190" width="16" height="16" rx="2" fill="#8b949e" stroke="#ffffff" stroke-width="1.5"/>
    <text x="76" y="203" fill="#f0f6fc" font-family="monospace" font-size="12" font-weight="bold">GND</text>

    <!-- GPIO 22 (SCL) -->
    <rect x="53" y="235" width="16" height="16" rx="2" fill="#d29922" stroke="#ffffff" stroke-width="1.5"/>
    <text x="76" y="248" fill="#e3b341" font-family="monospace" font-size="12" font-weight="bold">D22 / GPIO 22 (SCL)</text>

    <!-- GPIO 21 (SDA) -->
    <rect x="53" y="272" width="16" height="16" rx="2" fill="#2ea043" stroke="#ffffff" stroke-width="1.5"/>
    <text x="76" y="285" fill="#56d364" font-family="monospace" font-size="12" font-weight="bold">D21 / GPIO 21 (SDA)</text>

    <!-- USB socket at bottom -->
    <rect x="115" y="292" width="60" height="22" rx="3" fill="#6e7681" stroke="#d0d7de" stroke-width="1"/>
    <text x="145" y="307" fill="#0d1117" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">USB</text>
  </g>

  <!-- 4 Color-Coded Jumper Wires -->
  <!-- Wire 4: S1 Pin 2 (+5V) -> ESP32 VIN -->
  <path d="M 203 145 L 603 145" fill="none" stroke="#ff4444" stroke-width="4"/>
  <text x="450" y="137" fill="#ff7b72" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
    Kabel 4: +5V Strom (S1 Pin 2 Mitte → VIN)
  </text>

  <!-- Wire 1: EXT1 Pin 2 (GND) -> ESP32 GND -->
  <path d="M 235 254 L 603 254" fill="none" stroke="#8b949e" stroke-width="4"/>
  <text x="450" y="246" fill="#d0d7de" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
    Kabel 1: Masse (EXT1 Pin 2 → GND)
  </text>

  <!-- Wire 2: EXT1 Pin 5 (SCL) -> ESP32 D22 -->
  <path d="M 173 341 L 390 341 L 390 299 L 603 299" fill="none" stroke="#d29922" stroke-width="4"/>
  <text x="475" y="291" fill="#e3b341" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
    Kabel 2: I²C Takt (EXT1 Pin 5 → D22)
  </text>

  <!-- Wire 3: EXT1 Pin 6 (SDA) -> ESP32 D21 -->
  <path d="M 235 341 L 603 341" fill="none" stroke="#2ea043" stroke-width="4"/>
  <text x="450" y="360" fill="#56d364" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
    Kabel 3: I²C Daten (EXT1 Pin 6 → D21)
  </text>
</svg>
